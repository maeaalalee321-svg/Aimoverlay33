name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o "*.zip"
      - name: Apply override
        run: |
          if [ -f override/Detector.kt ]; then
            cp override/Detector.kt AimOverlay/app/src/main/java/com/aimoverlay/Detector.kt
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: AimOverlay
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AimOverlay-apk
          path: AimOverlay/app/build/outputs/apk/debug/app-debug.apk
          
