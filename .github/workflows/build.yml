name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::No zip in repo root. Files here: $(ls | tr '\n' ' ')"
            exit 1
          fi
          z="${zips[${#zips[@]}-1]}"
          echo "Using $z"
          unzip -q -o "$z"
          if [ ! -d AimOverlay ]; then
            echo "::error::AimOverlay folder missing after unzip. Files: $(ls | tr '\n' ' ')"
            exit 1
          fi
      - name: Apply override
        run: |
          if [ -f override/Detector.kt ]; then
            cp override/Detector.kt AimOverlay/app/src/main/java/com/aimoverlay/Detector.kt
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: AimOverlay
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AimOverlay-apk
          path: AimOverlay/app/build/outputs/apk/debug/app-debug.apk
          
